<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroFeira - Cadastro de Produtor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <a class="pular" href="#conteudo-principal">Pular para o conteúdo</a>

  <header class="cabecalho-site">
    <h1>AgroFeira</h1>
    <nav aria-label="Principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="safra.html">Safra</a></li>
        <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de produtor</a></li>
        <li><a href="sobre.html">Sobre</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo-principal">
    <h2>Faça parte da nossa feira</h2>

    <form class="formulario-cadastro">
      <fieldset>
        <legend>Quem é você</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" autocomplete="tel">

        <label for="caf">Número do CAF</label>
        <input type="text" id="caf" name="caf">

        <label for="cep">CEP da propriedade</label>
        <input type="text" id="cep" name="cep" inputmode="numeric" pattern="[0-9]{5}-?[0-9]{3}" aria-describedby="dica-cep">
        <p id="dica-cep">Formato: 00000-000</p>
      </fieldset>

      <fieldset>
        <legend>O que você vende</legend>

        <label for="produto-principal">Produto principal</label>
        <select id="produto-principal" name="produto-principal" required>
          <option value="">Escolha um produto</option>
          <option value="mandioca">Mandioca</option>
          <option value="banana">Banana-prata</option>
          <option value="acai">Açaí</option>
          <option value="pimenta">Pimenta-do-reino</option>
          <option value="cupuacu">Cupuaçu</option>
          <option value="alface">Alface</option>
        </select>

        <label for="quantidade">Quantidade por semana</label>
        <input type="number" id="quantidade" name="quantidade" required min="1" max="500" step="1">

        <label for="data-entrega">Começa a entregar em</label>
        <input type="date" id="data-entrega" name="data-entrega">

        <fieldset>
          <legend>Como entrega</legend>
          <input type="radio" id="tipo-feira" name="como-entrega" value="feira">
          <label for="tipo-feira">Leva à feira</label>

          <input type="radio" id="tipo-propriedade" name="como-entrega" value="propriedade">
          <label for="tipo-propriedade">A feira retira na propriedade</label>
        </fieldset>

        <label for="observacao">Observação</label>
        <textarea id="observacao" name="observacao" rows="4"></textarea>

        <div>
          <input type="checkbox" id="aceite" name="aceite" required>
          <label for="aceite">Li e aceito as regras da feira</label>
        </div>
      </fieldset>

      <button type="submit">Enviar cadastro</button>
    </form>

    <p role="status" aria-live="polite"></p>
  </main>

  <footer class="rodape-site">
    <p>&copy; 2026 AgroFeira - Paragominas, Pará</p>
  </footer>

</body>
</html>
