<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroFeira — Cadastro de Produtor</title>
  <link rel="stylesheet" href="camadas.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="componentes.css">
  <link rel="stylesheet" href="utilitarios.css">
  <script defer src="tema.js"></script>
</head>
<body>
  <a href="#conteudo" class="link-pular">Pular para o conteúdo</a>

  <header class="cabecalho-principal">
    <div class="container container-flex">
      <a href="index.html" class="logo">AgroFeira</a>
      <div class="menu-navegacao">
        <nav aria-label="Navegação principal">
          <ul class="menu">
            <li><a href="index.html">Início</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="safra.html">Safra</a></li>
            <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de produtor</a></li>
            <li><a href="sobre.html">Sobre</a></li>
          </ul>
        </nav>
        <button type="button" class="btn-tema" id="btn-alterna-tema" aria-label="Alternar modo claro e escuro">
          🌓 <span id="txt-tema">Tema</span>
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo" class="container">
    <h1>Cadastro de Produtor</h1>
    <p>Cadastre o seu sítio ou comunidade para vender na AgroFeira de Paragominas.</p>

    <form action="#" method="post" style="max-width: 600px; display: flex; flex-direction: column; gap: var(--espaco-3);">
      <fieldset style="border: 1px solid var(--cor-borda); border-radius: var(--raio); padding: var(--espaco-3);">
        <legend style="padding: 0 var(--espaco-2); font-weight: 700;">Quem é você</legend>
        
        <div style="display: flex; flex-direction: column; gap: var(--espaco-1); margin-bottom: var(--espaco-3);">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" required style="padding: var(--espaco-2); border-radius: var(--raio); border: 1px solid var(--cor-borda); background: var(--cor-superficie); color: var(--cor-texto);">
        </div>

        <div style="display: flex; flex-direction: column; gap: var(--espaco-1); margin-bottom: var(--espaco-3);">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required style="padding: var(--espaco-2); border-radius: var(--raio); border: 1px solid var(--cor-borda); background: var(--cor-superficie); color: var(--cor-texto);">
        </div>

        <div style="display: flex; flex-direction: column; gap: var(--espaco-1); margin-bottom: var(--espaco-3);">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" name="telefone" required style="padding: var(--espaco-2); border-radius: var(--raio); border: 1px solid var(--cor-borda); background: var(--cor-superficie); color: var(--cor-texto);">
        </div>

        <div style="display: flex; flex-direction: column; gap: var(--espaco-1);">
          <label for="caf">Número do CAF ou DAP</label>
          <input type="text" id="caf" name="caf" required style="padding: var(--espaco-2); border-radius: var(--raio); border: 1px solid var(--cor-borda); background: var(--cor-superficie); color: var(--cor-texto);">
        </div>
      </fieldset>

      <button type="submit" class="btn-primario" style="align-self: flex-start;">Enviar cadastro</button>
    </form>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>&copy; 2026 AgroFeira — Paragominas, Pará</p>
    </div>
  </footer>
</body>
</html>
